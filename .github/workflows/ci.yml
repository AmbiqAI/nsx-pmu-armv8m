name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint C sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check formatting (advisory)
        continue-on-error: true
        run: |
          find includes-api src \
            -name '*.c' -o -name '*.h' \
          | xargs clang-format-18 --dry-run --Werror --style=file:.clang-format 2>&1 \
          || echo "::warning::Some files need formatting. Run: clang-format -i <files>"

  version-check:
    name: Validate version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release metadata
        run: python3 tools/check_release_consistency.py

      - name: Check PMU catalog drift
        run: python3 tools/export_pmu_catalog.py --check

  cmake-smoke:
    name: Configure and link CMake target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests/cmake-smoke -B build/cmake-smoke

      - name: Build and link
        run: cmake --build build/cmake-smoke --parallel

      - name: Run smoke executable
        run: ctest --test-dir build/cmake-smoke --output-on-failure
